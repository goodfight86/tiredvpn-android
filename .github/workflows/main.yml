name: Build Android APK
on: [workflow_dispatch] # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew assembleDebug # Собирает отладочный APK, который легко ставится на любой телефон

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiredvpn-app
          path: app/build/outputs/apk/debug/*.apk
